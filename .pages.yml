media:
  input: public/assets/images
  output: /callesil-site/assets/images

content:
  - name: products
    label: Products
    type: file
    path: src/content/data/products.json
    format: json
    list: true

    fields:
      - name: id
        label: ID
        type: string

      - name: slug
        label: Slug
        type: string

      - name: name
        label: Product Name
        type: string

      - name: image
        label: Product Image
        type: image
        required: false

      - name: category
        label: Category
        type: string

      - name: price
        label: Price
        type: string
        required: false

      - name: tag
        label: Tag
        type: string
        required: false

      - name: shortDescription
        label: Short Description
        type: text

      - name: description
        label: Description
        type: text

      - name: details
        label: Product Details
        type: string
        list: true

      - name: sizes
        label: Available Sizes
        type: string
        list: true

      - name: fit
        label: Fit
        type: string

      - name: shipping
        label: Shipping
        type: string

      - name: etsyUrl
        label: Etsy Link
        type: string

      - name: reviews
        label: Reviews
        type: object
        list: true
        fields:
          - name: id
            label: Review ID
            type: string

          - name: author
            label: Author
            type: string

          - name: rating
            label: Rating
            type: number

          - name: text
            label: Review
            type: text

          - name: date
            label: Date
            type: string

  - name: home
    label: Home Page
    type: file
    path: src/content/pages/home.json
    format: json

    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - name: headline
            label: Headline
            type: string

          - name: subheadline
            label: Subheadline
            type: text

          - name: cta
            label: Button Text
            type: string

          - name: image
            label: Hero Image
            type: image

      - name: shopOurDesigns
        label: Shop Our Designs
        type: object
        fields:
          - name: label
            label: Section Title
            type: string

          - name: products
            label: Products
            type: object
            list: true
            fields:
              - name: id
                label: ID
                type: string

              - name: name
                label: Product Name
                type: string

              - name: image
                label: Product Image
                type: image

              - name: etsyUrl
                label: Etsy Link
                type: string

      - name: featuredCollection
        label: Featured Collection
        type: object
        fields:
          - name: label
            label: Section Title
            type: string

          - name: products
            label: Products
            type: object
            list: true
            fields:
              - name: id
                label: ID
                type: string

              - name: name
                label: Product Name
                type: string

              - name: tag
                label: Tag
                type: string
                required: false

              - name: price
                label: Price
                type: string
                required: false

      - name: bestSellers
        label: Best Sellers
        type: object
        fields:
          - name: label
            label: Section Title
            type: string

          - name: products
            label: Products
            type: object
            list: true
            fields:
              - name: id
                label: ID
                type: string

              - name: name
                label: Product Name
                type: string

              - name: image
                label: Product Image
                type: image

              - name: etsyUrl
                label: Etsy Link
                type: string

      - name: newArrivals
        label: Halloween Collection
        type: object
        fields:
          - name: label
            label: Section Label
            type: string

          - name: headline
            label: Headline
            type: string

          - name: subtext
            label: Subtext
            type: text

          - name: cta
            label: Button Text
            type: string

          - name: image
            label: New Arrivals Image
            type: image

      - name: about
        label: About CALLESIL
        type: object
        fields:
          - name: label
            label: Section Label
            type: string

          - name: headline
            label: Headline
            type: string

          - name: body
            label: Body
            type: text

          - name: cta
            label: Button Text
            type: string

          - name: image
            label: About Image
            type: image

      - name: reviews
        label: Homepage Reviews
        type: object
        fields:
          - name: label
            label: Section Title
            type: string
          - name: items
            label: Reviews
            type: object
            list: true
            fields:
              - name: id
                label: ID
                type: string

              - name: quote
                label: Review
                type: text

              - name: author
                label: Author
                type: string

      - name: newsletter
        label: Newsletter
        type: object
        fields:
          - name: headline
            label: Headline
            type: string

          - name: subtext
            label: Subtext
            type: text

          - name: placeholder
            label: Email Placeholder
            type: string

          - name: cta
            label: Button Text
            type: string

      - name: instagram
        label: Instagram
        type: object
        fields:
          - name: label
            label: Section Title
            type: string

          - name: images
            label: Instagram Images
            type: image
            list: true
